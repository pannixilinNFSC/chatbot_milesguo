name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - v2
  pull_request:
    types:
      - closed
    branches:
      - main
      - master
      - v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy on merge to main/master/v2, not on PR close without merge
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Inject build timestamp
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_SHA=$(git rev-parse --short HEAD)
          sed -i "s#<!-- BUILD_INFO -->#<!-- Build: $BUILD_TIME | SHA: $BUILD_SHA -->#g" frontend/rag.html
          sed -i "s#<!-- BUILD_INFO -->#<!-- Build: $BUILD_TIME | SHA: $BUILD_SHA -->#g" frontend/agentic.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

